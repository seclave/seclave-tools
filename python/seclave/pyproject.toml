# Packaging for PyPI: one stdlib-only package, no dependencies. Version is
# read from VERSION in seclave/__init__.py; bump it with scripts/set_version.py
# at the repo root, which keeps the sibling packages in step.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "seclave"
dynamic = ["version"]
description = "The Seclave hardware password manager's USB-slave wire protocol: framing, serial transports, and device session"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Seclave AB", email = "code@seclave.se"}]
requires-python = ">=3.9"
keywords = ["seclave", "password-manager", "hardware", "usb", "serial", "protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: System :: Hardware",
]

[project.urls]
Homepage = "https://www.seclave.se"
Source = "https://github.com/seclave/seclave-tools"

[tool.setuptools]
packages = ["seclave"]

[tool.setuptools.dynamic]
version = {attr = "seclave.VERSION"}
