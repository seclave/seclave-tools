# Packaging for PyPI. Version is read from VERSION in seclave_ctl.py; bump it
# with scripts/set_version.py at the repo root, which keeps the sibling
# packages in step.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "seclave-ctl"
dynamic = ["version"]
description = "Command-line client for the Seclave hardware password manager"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Seclave AB", email = "code@seclave.se"}]
requires-python = ">=3.9"
dependencies = ["seclave>=0.1,<2"]
keywords = ["seclave", "password-manager", "hardware", "usb", "serial", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://www.seclave.se"
Source = "https://github.com/seclave/seclave-tools"

[project.scripts]
seclave-ctl = "seclave_ctl:main"

[tool.setuptools]
py-modules = ["seclave_ctl"]

[tool.setuptools.dynamic]
version = {attr = "seclave_ctl.VERSION"}
