# Host-side Rust workspace. The seclave crate is the protocol library; a
# seclave-ctl binary crate joins it once the session/transport layers land.

[workspace]
resolver = "2"
members = ["seclave", "seclave-ctl"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"
authors = ["seclave <code@seclave.se>"]
repository = "https://github.com/seclave/seclave-tools"
homepage = "https://www.seclave.se"
